services:

  # ===== KAFKA INFRASTRUCTURE =====
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: stockpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: stockpulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stockpulse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockpulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ===== DATABASES =====
  postgres-market:
    image: timescale/timescaledb:latest-pg16
    container_name: stockpulse-postgres-market
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse_dev
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-portfolio:
    image: postgres:16
    container_name: stockpulse-postgres-portfolio
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse_dev
    volumes:
      - postgres_portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-alert:
    image: postgres:16
    container_name: stockpulse-postgres-alert
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse_dev
    volumes:
      - postgres_alert_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d alerts"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_market_data:
  postgres_portfolio_data:
  postgres_alert_data: