services:

  # ===== KAFKA INFRASTRUCTURE =====
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: stockpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: stockpulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stockpulse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockpulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ===== DATABASES =====
  postgres-market:
    image: timescale/timescaledb:latest-pg16
    container_name: stockpulse-postgres-market
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-portfolio:
    image: postgres:16
    container_name: stockpulse-postgres-portfolio
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-alert:
    image: postgres:16
    container_name: stockpulse-postgres-alert
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_alert_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d alerts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== SERVICES =====
  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    container_name: stockpulse-market-data
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-market:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-market:5432/market_data
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: stockpulse-portfolio
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-portfolio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-portfolio:5432/portfolio
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: stockpulse-alert
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-alert:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-alert:5432/alerts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: stockpulse-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      market-data-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      alert-service:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET:-stockpulse-dev-secret-key-minimum-256-bits-long}
      MARKET_DATA_SERVICE_URL: http://stockpulse-market-data:8081
      PORTFOLIO_SERVICE_URL: http://stockpulse-portfolio:8082
      ALERT_SERVICE_URL: http://stockpulse-alert:8083
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

volumes:
  postgres_market_data:
  postgres_portfolio_data:
  postgres_alert_data: