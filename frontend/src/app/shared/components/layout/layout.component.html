<mat-sidenav-container class="sidenav-container">
  <mat-sidenav class="sidenav" mode="side" opened>
    <div class="sidenav-header">
      <mat-icon class="logo-icon">trending_up</mat-icon>
      <span class="brand">StockPulse</span>
    </div>

    <mat-nav-list>
      <a mat-list-item class="nav-link" routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item class="nav-link" routerLink="/portfolio" routerLinkActive="active-link">
        <mat-icon matListItemIcon>account_balance_wallet</mat-icon>
        <span matListItemTitle>Portfolio</span>
      </a>
      <a mat-list-item class="nav-link" routerLink="/alerts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>notifications</mat-icon>
        <span matListItemTitle>Alerts</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <span class="toolbar-spacer"></span>
      @if (userId()) {
        <span class="user-id">{{ userId() }}</span>
      }
      <button mat-icon-button matTooltip="Logout" (click)="onLogout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
