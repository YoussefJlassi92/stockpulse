name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─── Job 1: Java tests ────────────────────────────────────────────────────────
jobs:
  test-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrappers executable
        run: find . -name "mvnw" -exec chmod +x {} \;

      - name: Test market-data-service
        run: cd services/market-data-service && ./mvnw test

      - name: Test portfolio-service
        run: cd services/portfolio-service && ./mvnw test

      - name: Test alert-service
        run: cd services/alert-service && ./mvnw test

      - name: Test analytics-service
        run: cd services/analytics-service && ./mvnw test

      - name: Test api-gateway
        run: cd services/api-gateway && ./mvnw test

# ─── Job 2: Frontend tests ────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests headless
        run: cd frontend && npx ng test --watch=false --no-progress --browsers=ChromeHeadlessNoSandbox

# ─── Job 3: Build & push Docker images ───────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    needs: [ test-java, test-frontend ]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the repository name — GHCR requires it
      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push market-data-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/market-data-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/market-data-service:latest
            ${{ env.IMAGE_PREFIX }}/market-data-service:${{ github.sha }}
          cache-from: type=gha,scope=market-data-service
          cache-to: type=gha,scope=market-data-service,mode=max

      - name: Build and push portfolio-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/portfolio-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/portfolio-service:latest
            ${{ env.IMAGE_PREFIX }}/portfolio-service:${{ github.sha }}
          cache-from: type=gha,scope=portfolio-service
          cache-to: type=gha,scope=portfolio-service,mode=max

      - name: Build and push alert-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/alert-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/alert-service:latest
            ${{ env.IMAGE_PREFIX }}/alert-service:${{ github.sha }}
          cache-from: type=gha,scope=alert-service
          cache-to: type=gha,scope=alert-service,mode=max

      - name: Build and push analytics-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/analytics-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/analytics-service:latest
            ${{ env.IMAGE_PREFIX }}/analytics-service:${{ github.sha }}
          cache-from: type=gha,scope=analytics-service
          cache-to: type=gha,scope=analytics-service,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api-gateway:latest
            ${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,scope=api-gateway,mode=max

      # Frontend uses ./frontend as build context (nginx + Angular bundle)
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
